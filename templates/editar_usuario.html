{% extends "base.html" %} {% block title %} Editar Usuário - Biblioteca {%
endblock %} {% block content %}

<h1>Editar Usuário</h1>

<form action="/usuarios/editar/{{ usuario.id }}" method="POST">
  <div>
    <label for="nome"> Nome </label>

    <input
      type="text"
      id="nome"
      name="nome"
      value="{{ usuario.nome }}"
      required
    />
  </div>

  <div>
    <label for="telefone"> Telefone </label>

    <input
      type="text"
      id="telefone"
      name="telefone"
      value="{{ usuario.telefone or '' }}"
    />
  </div>

  <div>
    <label for="email"> E-mail </label>

    <input
      type="email"
      id="email"
      name="email"
      value="{{ usuario.email or '' }}"
      required
    />
  </div>

  <div>
    <label for="senha"> Nova senha </label>

    <input
      type="password"
      id="senha"
      name="senha"
      placeholder="Deixe vazio para manter a senha atual"
    />
  </div>

  <div>
    <label>
      <input
        type="checkbox"
        name="admin"
        {%
        if
        usuario.admin
        %}checked{%
        endif
        %}
      />

      Administrador
    </label>
  </div>

  <button type="submit">Salvar alterações</button>

  <a href="/usuarios">
    <button type="button">Cancelar</button>
  </a>
</form>

{% endblock %}
