{% extends "base.html" %}

{% block title %}
    Alterar senha
{% endblock %}


{% block content %}

<div class="cabecalho-pagina">

    <div>

        <div class="breadcrumb">
            <a href="{{ url_for('index') }}">
                Início
            </a>

            <span>/</span>

            <span>
                Alterar senha
            </span>
        </div>


        <h1 class="titulo-pagina">
            Alterar senha
        </h1>


        <p class="subtitulo-pagina">
            Altere a senha da sua conta de acesso ao sistema.
        </p>

    </div>

</div>


<section class="secao">

    <h2 class="secao-titulo">
        Alterar senha
    </h2>


    <p class="secao-subtitulo">
        Informe sua senha atual e defina uma nova senha.
    </p>


    <form
        action="{{ url_for('alterar_senha') }}"
        method="POST"
        class="formulario"
    >

        <div class="campo">

            <label for="senha_atual">
                Senha atual
            </label>

            <input
                type="password"
                id="senha_atual"
                name="senha_atual"
                autocomplete="current-password"
                required
            >

        </div>


        <div class="campo">

            <label for="nova_senha">
                Nova senha
            </label>

            <input
                type="password"
                id="nova_senha"
                name="nova_senha"
                autocomplete="new-password"
                required
            >

        </div>


        <div class="campo">

            <label for="confirmar_senha">
                Confirmar nova senha
            </label>

            <input
                type="password"
                id="confirmar_senha"
                name="confirmar_senha"
                autocomplete="new-password"
                required
            >

        </div>


        <div class="acoes-formulario">

            <a
                href="{{ url_for('index') }}"
                class="botao"
            >
                Cancelar
            </a>


            <button
                type="submit"
                class="botao botao-principal"
            >
                Alterar senha
            </button>

        </div>

    </form>

</section>

{% endblock %}
